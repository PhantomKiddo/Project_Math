<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Project_Math(Home)</title>
        <link rel="icon" href="Images/UI/Web_Icon.svg">

        <link rel="stylesheet" href="Css/Aero.css">
        <link rel="stylesheet" href="Css/BoxCS.css">
        <link rel="stylesheet" href="Css/Quirks.css">
    
    </head>

    <header>
        <h1>Project_Math(<img src="Images/UI/Web_Icon.svg" height="30" alt="">)</h1>
    </header>

    <body class="Background">

        <div class="Main">
            
            <!--{Dashboard_Buttons_Left}-->

            <div id="DashBoard_Slider_Left">

                <button class="Slider_Buttons" id="Water">
                    <h2 class="Rotate_90_degree">Library</h2>
                </button>

                <button class="Slider_Buttons"  id="Earth">
                    <h2 class="Rotate_90_degree">Comic</h2>
                </button>

            </div>

            <!--{Slider}-->

            <div class="Slider_Content" id="Slider">

                <div class="Slider_Display Water" >
                    <h1 class="Wht" >1 | <img src="Images/UI/Web_Library.svg" height="50" alt=""> Library</h1>

                    <div class="Library" id="Main_Post">

                        

                    </div>

                </div>

                <div class="Slider_Display Earth">
                    <h1 class="Wht" >2 | <img src="Images/UI/Web_Comic.svg" height="50" alt=""> Comic</h1> 

                    <div class="Comic">

                        <div class="Content_Card_Background Grid_A">
                            <div alt="Project_Math()" class="Content_Card_Display">
                                
                            </div>
                        </div>

                        <div class="Glass_Content Grid_B">
                            <h2 class="Wht">Project_Math()</h2>
                        </div>
                        
                        <div class="Glass_Content Grid_C">

                            <button class="Bubbles" onclick="JumpLink(0)">
                                <h3>Read the Comic</h3>
                            </button>

                            <button class="Bubbles" id="CONTINUE">
                                <h3>Continue</h3>
                            </button>

                            <button class="Bubbles" id="RESET">
                                <h3>Reset</h3>
                            </button>

                        </div>

                        <div class="Glass_Content Grid_D">
                            <p></p>
                        </div>
                    </div>

                </div>

                <div class="Slider_Display Fire">
                    <h1 class="Wht" >3 | <img src="Images/UI/Web_Game.svg" height="50" alt=""> Games</h1>
                </div>

                <div class="Slider_Display Air">
                    <h1 class="Wht" >4 | <img src="Images/UI/Web_Social.svg" height="50" alt=""> Forums</h1>
                </div>

            </div>

            <!--{Dashboard_Buttons_Right}-->

            <div id="DashBoard_Slider_Right">

                <button class="Slider_Buttons" id="Fire">
                    <h2 class="Rotate_90_degree">Games</h2>
                </button>

                <button class="Slider_Buttons" id="Air">
                    <h2 class="Rotate_90_degree">Forums</h2>
                </button>

            </div>

        </div>
        
    </body>

    <script src="Js/Dashboard_Slider.js"></script>

    <script src="Js/Content_Display.js"></script>
    
    <script src="Js/Json_Comic.js"></script>

    <footer class="CENTER">
        <h2 > &#169; 2023 Project_Math() | All Rights reserve </h2>
    </footer>
</html>
